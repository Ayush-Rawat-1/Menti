<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Soft Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Leaf / Mind Layer Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Icon Container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGlow)" />

  <!-- Central Symbol: Brain / Growth Leaf Node -->
  <g filter="url(#softShadow)" transform="translate(0, 1)">
    <!-- Left Brain Hemisphere / Leaf -->
    <path d="M 32 16 C 24 16, 17 22, 17 31 C 17 38, 23 44, 32 48 C 30 40, 26 34, 20 28 C 27 28, 30 22, 32 16 Z" 
          fill="#FFFFFF" 
          opacity="0.95" />

    <!-- Right Brain Hemisphere / Flourishing Leaf -->
    <path d="M 32 16 C 40 16, 47 22, 47 31 C 47 38, 41 44, 32 48 C 34 40, 38 34, 44 28 C 37 28, 34 22, 32 16 Z" 
          fill="url(#leafGrad)" />

    <!-- Center Neural Spark / Core Dot -->
    <circle cx="32" cy="28" r="3" fill="#047857" />
  </g>
</svg>
